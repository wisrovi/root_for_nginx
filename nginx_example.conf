# ModSecurity / Reverse Proxy Snippet para Nginx

# 1. Configuración del Root (Página de Bienvenida / Tetris)
location = / {
    root /home/wisrovi/Documents/test_demo/default-web;
    index index.html;
    try_files /index.html =404;
}

# 2. Rutas del backend / APIs externas protegidas por WAF
location /api/ {
    # ModSecurity habilitado
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    proxy_pass http://tu_backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
